# 推送 v* 标签时自动打包，并把 exe / .app 上传到 GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-win.txt
          pip install pyinstaller pillow
          pip uninstall -y pathlib 2>nul || exit 0

      - name: Verify entrypoint
        run: python -m py_compile main.py app_meta.py ui_theme.py

      - name: Generate icon
        run: |
          if (Test-Path assets/icon.ico) { Write-Host "Using committed assets/icon.ico" }
          else { python scripts/make_icon.py }

      - name: PyInstaller
        run: python -m PyInstaller packaging/win.spec --noconfirm

      - name: Build Windows installer
        run: |
          choco install innosetup -y
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}","${env:ProgramFiles}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          Push-Location packaging
          & $iscc windows-installer.iss
          Pop-Location

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/SplitScreenSnap.exe
            dist/SplitScreenSnap-Setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          pip uninstall -y pathlib || true

      - name: Verify entrypoint
        run: python -m py_compile main.py app_meta.py ui_theme.py

      - name: Generate icon
        run: python scripts/make_icon.py

      - name: PyInstaller
        run: python -m PyInstaller packaging/mac.spec --noconfirm

      - name: Zip app
        run: |
          APP=$(find dist -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "No .app in dist:"; ls -la dist; exit 1; fi
          ditto -c -k --keepParent "$APP" SplitScreenSnap-mac.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: SplitScreenSnap-mac.zip

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows-exe/SplitScreenSnap.exe
            artifacts/windows-exe/SplitScreenSnap-Setup.exe
            artifacts/macos-app/SplitScreenSnap-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
